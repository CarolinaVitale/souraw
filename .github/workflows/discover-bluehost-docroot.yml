name: Discover Bluehost docroot (temporary)

# Read-only helper: lists the SFTP home and every index.html near the top of it,
# to find the folder Apache serves for souraw.com. Delete this file once
# BLUEHOST_TARGET_DIR is correct.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.BLUEHOST_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BLUEHOST_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: List remote folders (read-only)
        env:
          HOST: ${{ secrets.BLUEHOST_HOST }}
          USER_NAME: ${{ secrets.BLUEHOST_USER }}
          PORT: ${{ secrets.BLUEHOST_PORT }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp >/dev/null
          SSH_CMD="ssh -a -x -i $HOME/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          LFTP_OPEN="set cmd:fail-exit yes; set net:max-retries 3; set net:timeout 30; set sftp:connect-program \"$SSH_CMD\"; open -u \"$USER_NAME,unused\" -p ${PORT:-22} sftp://$HOST"

          echo "== home directory =="
          lftp -c "$LFTP_OPEN; cls -l ."

          echo "== index.html files (depth <= 3) =="
          lftp -c "$LFTP_OPEN; find -d 3 ." > "$RUNNER_TEMP/tree.txt" || true
          grep -E '(^|/)index\.html$' "$RUNNER_TEMP/tree.txt" | tee "$RUNNER_TEMP/index-files.txt"

          echo "== details of each (size/date) =="
          while read -r f; do
            lftp -c "$LFTP_OPEN; cls -l \"$f\"" || true
          done < "$RUNNER_TEMP/index-files.txt"
